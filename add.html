{% extends 'base.html' %}

{% block content %}

<div class="glass-card form-card">

    <h2>Tambah Barang</h2>

    <form method="POST">

        <input type="text"
               name="nama_barang"
               placeholder="Nama Barang"
               required>

        <input type="text"
               name="kategori"
               placeholder="Kategori"
               required>

        <input type="number"
               name="jumlah"
               placeholder="Jumlah"
               required>

        <input type="text"
               name="lokasi"
               placeholder="Lokasi Penyimpanan"
               required>

        <button type="submit"
                class="btn">
            Simpan
        </button>

    </form>

</div>

{% endblock %}
